<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="420" fill="#050505"/>

  <defs>
    <radialGradient id="redGlowA" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#E10600" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#B00020" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="redGlowB" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FF2A2A" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#7A0000" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="signalLine" x1="0" y1="0" x2="1400" y2="0">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="38%" stop-color="#E10600"/>
      <stop offset="58%" stop-color="#FF4B4B"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#300000" stroke-width="1"/>
    </pattern>

    <pattern id="microDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#E10600" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="1400" height="420" fill="url(#grid)" opacity="0.70"/>
  <rect width="1400" height="420" fill="url(#microDots)" opacity="0.65"/>

  <circle cx="1140" cy="92" r="315" fill="url(#redGlowA)">
    <animate attributeName="r" values="285;335;285" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;0.55;0.85" dur="6s" repeatCount="indefinite"/>
  </circle>

  <circle cx="260" cy="330" r="260" fill="url(#redGlowB)">
    <animate attributeName="r" values="230;285;230" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0.8;0.45" dur="7s" repeatCount="indefinite"/>
  </circle>

  <path d="M0 300 C210 210 355 390 610 270 C830 170 1035 205 1400 104" stroke="url(#signalLine)" stroke-width="4" opacity="0.90" filter="url(#glow)"/>
  <path d="M0 324 C240 230 350 410 620 292 C845 192 1030 224 1400 134" stroke="#E10600" stroke-width="1.4" opacity="0.40"/>

  <rect x="72" y="68" width="610" height="215" rx="28" fill="#0D1117" stroke="#E10600" stroke-width="2.4"/>
  <rect x="92" y="88" width="570" height="175" rx="20" fill="#050505" opacity="0.38"/>

  <rect x="105" y="105" width="150" height="13" rx="6.5" fill="#E10600">
    <animate attributeName="width" values="110;190;110" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="105" y="134" width="430" height="9" rx="4.5" fill="#3A3A3A"/>
  <rect x="105" y="158" width="310" height="9" rx="4.5" fill="#3A3A3A"/>

  <text x="105" y="218" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="46" font-weight="900">
    Luis Carlos Fuentes
  </text>
  <text x="108" y="253" fill="#E10600" font-family="JetBrains Mono, Consolas, monospace" font-size="23" font-weight="700">
    Applied AI · Agentic Systems · Backend
  </text>

  <g transform="translate(950 204)">
    <rect x="0" y="0" width="330" height="98" rx="20" fill="#0D1117" stroke="#B00020" stroke-width="2"/>
    <circle cx="37" cy="49" r="10" fill="#E10600">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <text x="64" y="40" fill="#E10600" font-family="JetBrains Mono, Consolas, monospace" font-size="19" font-weight="800">
      RED SIGNAL ONLINE
    </text>
    <text x="64" y="69" fill="#FFFFFF" font-family="JetBrains Mono, Consolas, monospace" font-size="16">
      systems · agents · data
    </text>
  </g>

  <g opacity="0.32">
    <rect x="0" y="0" width="1400" height="3" fill="#FF2A2A">
      <animate attributeName="y" values="0;420;0" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g opacity="0.9">
    <text x="1070" y="92" fill="#FFFFFF" font-family="JetBrains Mono, Consolas, monospace" font-size="16">
      &gt; build useful AI
    </text>
    <text x="1070" y="122" fill="#E10600" font-family="JetBrains Mono, Consolas, monospace" font-size="16">
      &gt; ship real systems
    </text>
  </g>
</svg>
